name: Aktualizace dat a nasazení

on:
  schedule:
    - cron: "0 6 * * 1"   # každé pondělí 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testy výpočtů
        run: python -m pytest -q

      # Surová data se cachují mezi běhy; když zdroj nejede, použije se poslední stažená verze.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Stažení zdrojů a build
        run: python -m pipeline.run_all

      - name: Commit site.json
        if: github.event_name != 'push'
        run: |
          git config user.name "co2-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/site.json site/site.json
          git diff --cached --quiet || (git commit -m "Aktualizace dat $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
